name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install build SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Compile and lint
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator acceleration
        run: |
          sudo chmod a+rw /dev/kvm
      - name: Check user workflow on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Collect installable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Bless-Offban-1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Bless-Offban-1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bless-Offban-1.0
          path: dist/Bless-Offban-1.0.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: app/build/reports/
          if-no-files-found: ignore
